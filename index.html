<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งซ่อม CHR</title>
  <meta name="theme-color" content="#14161a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="แจ้งซ่อม CHR">
  <script>
    // Home-screen launcher. Google Apps Script's own page can't carry a
    // manifest or apple-touch-icon, so phones add THIS page instead (proper
    // icon + name) and it forwards to the real web app.
    //
    // ?launch=1 = opened from the home-screen shortcut -> go straight in.
    // Without it the page stays put and shows how to add the shortcut; it
    // also rewrites its own URL to ?launch=1 so the shortcut iPhone saves
    // (it saves the current address) will forward when tapped.
    var APP_URL = 'https://script.google.com/macros/s/AKfycbwZ03PWNjUL4Wsb_AF3yDN8EUZxbr79i7iIdGmFTNXLhEDiGmuBWmERdNMsXQ0hTlNh/exec';
    var params = new URLSearchParams(location.search);
    var launching = params.get('launch') === '1';
    params.delete('launch');
    var rest = params.toString();
    var TARGET = APP_URL + (rest ? '?' + rest : '');
    if (launching) location.replace(TARGET);
  </script>
  <style>
    :root { --bg: #14161a; --card: #1f2227; --text: #ffffff; --muted: #9ca3af; --accent: #dc2626; --line: #2d3138; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, sans-serif; padding: 24px 16px; }
    main { width: 100%; max-width: 420px; text-align: center; }
    .logo { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 18px; margin: 16px 0 4px; }
    .sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
    .open { display: inline-block; padding: 12px 22px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; }
    .guide { margin-top: 22px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 13px; line-height: 1.6; }
    .guide h2 { font-size: 13.5px; margin: 0 0 4px; }
    .guide ol { margin: 0 0 10px; padding-left: 20px; color: #e5e7eb; }
    .guide ol:last-child { margin-bottom: 0; }
    #launchingNote { display: none; font-size: 13px; color: var(--muted); }
    body.launching .content { display: none; }
    body.launching #launchingNote { display: block; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icon-192.png" alt="CHR">
    <h1>ระบบแจ้งซ่อมเครื่องจักรและอุปกรณ์</h1>
    <p id="launchingNote">กำลังเปิดระบบ...</p>
    <div class="content">
      <p class="sub">CH.RADIATORS CO., LTD.</p>
      <a class="open" id="openLink" href="#">เปิดระบบ</a>
      <div class="guide">
        <h2>เพิ่มไอคอนไว้ที่หน้าจอโทรศัพท์</h2>
        <ol>
          <li><b>iPhone (Safari):</b> กดปุ่มแชร์ <b>⬆︎</b> ด้านล่าง → <b>เพิ่มไปยังหน้าจอโฮม</b> → <b>เพิ่ม</b></li>
          <li><b>Android (Chrome):</b> กดเมนู <b>⋮</b> มุมขวาบน → <b>เพิ่มลงในหน้าจอหลัก</b> → <b>เพิ่ม</b></li>
        </ol>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('openLink').href = TARGET;
    if (launching) {
      document.body.classList.add('launching');
    } else {
      var saved = new URLSearchParams(location.search);
      saved.set('launch', '1');
      history.replaceState(null, '', '?' + saved.toString());
    }
  </script>
</body>
</html>
